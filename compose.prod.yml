services:
  db:
    image: postgres:17-alpine3.20
    restart: always
    container_name: ka-db-prod
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ka-network
    healthcheck:
      test: pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  app: &app
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
    restart: always
    container_name: ka-app-prod
    environment:
      COMMAND: php artisan octane:frankenphp --host=0.0.0.0 --port=443 --https --http-redirect --max-requests=500
      PROCESS: app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - storage_data:/var/www/storage/app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    networks:
      - ka-network
    healthcheck:
      test: curl -sf http://localhost:2019/reverse_proxy/upstreams >/dev/null || curl -sk https://localhost/up >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_signal: SIGINT
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  workers:
    <<: *app
    container_name: ka-worker-prod
    environment:
      COMMAND: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=60
      PROCESS: worker
    volumes:
      - storage_data:/var/www/storage/app
    ports: []
    healthcheck:
      disable: true
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  schedule:
    <<: *app
    container_name: ka-schedule-prod
    environment:
      COMMAND: supercronic -quiet /var/www/docker/schedule/crontab
      PROCESS: schedule
    volumes:
      - storage_data:/var/www/storage/app
    ports: []
    healthcheck:
      test: supercronic -test /var/www/docker/schedule/crontab | grep -q 'is valid'
      interval: 30s
      timeout: 5s
      retries: 2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  websockets:
    <<: *app
    container_name: ka-websockets-prod
    environment:
      COMMAND: php artisan reverb:start --host=0.0.0.0 --port=8080
      PROCESS: reverb
    volumes: []
    ports:
      - '8080:8080'
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7.2.4-alpine
    restart: always
    container_name: ka-redis-prod
    command:
      - 'redis-server'
      - '--requirepass ${REDIS_PASSWORD}'
      - '--maxmemory 512mb'
      - '--maxmemory-policy allkeys-lru'
    volumes:
      - redis_data:/data
    networks:
      - ka-network
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
    name: ka_db_data_prod
  redis_data:
    driver: local
    name: ka_redis_data_prod
  caddy_data:
    driver: local
    name: ka_caddy_data_prod
  caddy_config:
    driver: local
    name: ka_caddy_config_prod
  storage_data:
    driver: local
    name: ka_storage_data_prod

networks:
  ka-network:
    driver: bridge
    name: ka-network-prod
