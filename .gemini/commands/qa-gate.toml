description = "Запустити паралельний Quality Gate для активного треку"

prompt = """
You are performing a Quality Gate fan-out for the active Conductor track.

## Step 1: Identify Track
Identify the active track ID from the user argument or by looking at the most recent entry in `conductor/tracks.md`.

## Step 2: Load Context
Read the track's `spec.md` and `plan.md` to understand the implementation scope.
Read the diff of changes associated with the track (search for commits starting with `conductor(<track-id>)`).

## Step 3: Parallel Fan-Out
In ONE turn, dispatch these four agents in parallel:

@tester "Write unit and feature tests for the changes in track {{args}}. Ensure 100% coverage of new Actions. Run mutation tests."

@reviewer "Perform a thorough code review of the implementation in track {{args}}. Check for convention compliance (strict types, getKey, Actions pattern) and potential bugs."

@security-scanner "Scan the implementation in track {{args}} for OWASP Top 10 vulnerabilities, specifically focusing on authorization policies and input validation."

@qa "Run Pest Browser smoke tests for any new or modified Inertia pages in track {{args}}. Verify basic user journeys on mobile viewports."

## Step 4: Consolidate Report
Wait for all agents to finish. Consolidate their findings into a single 'Quality Gate Report'.
- If all pass: Inform the user and suggest running `/ship`.
- If issues found: Route the list of findings to @developer for fixes.

## Step 5: Update Plan
Append the consolidated report summary to the track's `plan.md` and mark the Quality Gate task as complete.
"""
