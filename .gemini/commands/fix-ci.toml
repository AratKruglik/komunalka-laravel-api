description = "Діагностувати та виправити падіння GitHub Actions CI на PR"

prompt = """
You are diagnosing and fixing CI/CD failures on a Pull Request in the Komunalka GitHub repository. The CI system is GitHub Actions (workflow: `.github/workflows/ci.yml`).

CRITICAL: For PR metadata, prefer `github` MCP tools over `gh` CLI. For GitHub Actions CI data (run logs, job status), use `gh` CLI commands — `gh run list`, `gh run view`, `gh pr checks`. Do NOT scrape GitHub URLs or use `curl`/`WebFetch` for CI data.

## Input

The user provided: {{args}}

## Step 1: Parse the PR reference

Parse the input to determine the repository and PR number. Supported formats:
- `123` or `#123` — PR in current repo (detect via `git remote`)
- `repo#123` — PR in `{your_org}/repo`
- `{your_org}/repo#123` — full org/repo path
- `https://github.com/{your_org}/{your_repo}/pull/123` — full URL

If the input is empty or cannot be parsed, ask the user for the PR reference.

## Step 2: Fetch PR metadata

Primary — `github` MCP:
Use `mcp__github__pull_request_read` with `{"owner": "<ORG>", "repo": "<REPO>", "pullNumber": <NUMBER>}`.

Fallback — `gh` CLI:
```bash
GITHUB_TOKEN=$GITHUB_PERSONAL_ACCESS_TOKEN gh pr view <NUMBER> --repo <ORG>/<REPO> --json title,body,headRefName,baseRefName,files,additions,deletions,commits
```

Extract `headRefName` (the PR branch name) — you will need it for CI run lookups.

## Step 3: Fetch GitHub Actions failure data

Run these commands in parallel:

3a. Quick CI status check:
```bash
GITHUB_TOKEN=$GITHUB_PERSONAL_ACCESS_TOKEN gh pr checks <NUMBER> --repo <ORG>/<REPO>
```

3b. Find the latest CI run for the branch:
```bash
GITHUB_TOKEN=$GITHUB_PERSONAL_ACCESS_TOKEN gh run list \\
  --branch <headRefName> \\
  --repo <ORG>/<REPO> \\
  --workflow ci.yml \\
  --limit 5 \\
  --json databaseId,status,conclusion,displayTitle,createdAt
```

If all checks are green (no failures), inform the user that CI is passing and stop.

3c. Get failed job details (once you have the run ID):
```bash
GITHUB_TOKEN=$GITHUB_PERSONAL_ACCESS_TOKEN gh run view <run-id> \\
  --repo <ORG>/<REPO> \\
  --json jobs \\
  --jq '.jobs[] | select(.conclusion=="failure") | {name, conclusion, steps: [.steps[] | select(.conclusion=="failure") | {name, conclusion}]}'
```

3d. Get failure logs:
```bash
GITHUB_TOKEN=$GITHUB_PERSONAL_ACCESS_TOKEN gh run view <run-id> --repo <ORG>/<REPO> --log-failed
```

IMPORTANT: `--log-failed` output can be very large. If it is truncated, note that earlier failures may be missing.

### Identify failure type

Lint matrix:
- PHPStan — static analysis failure
- Laravel Pint — code style (auto-fixable with `./vendor/bin/pint`)
- Rector — code modernization (auto-fixable with `./vendor/bin/rector process`)
- Prettier — frontend formatting (auto-fixable with `pnpm prettier --write`)
- ESLint — frontend linting (often auto-fixable with `pnpm eslint --fix`)
- TypeScript — `pnpm tsc --noEmit` errors

Test matrix:
- Unit — unit test failure
- Feature — feature/integration test failure
- Coverage — test coverage failure (new code without tests?)
- Mutation — mutation testing failure (tests don't catch mutations)

## Step 4: Switch to the PR branch

```bash
git fetch origin <headRefName>
git checkout <headRefName>
```

If there are uncommitted local changes, stash them first and inform the user.

## Step 5: Dispatch the debugger agent

Invoke `@debugger` passing:
1. The `gh run view --log-failed` output
2. The failed job names and their step details from Step 3c
3. The failure type (lint vs test, and which specific tool)
4. The list of files changed in the PR
5. The PR branch name (already checked out locally)

Instruct the debugger to produce a structured diagnosis:
- Root cause (one sentence)
- Failure type: lint | unit test | feature test | coverage | mutation
- Affected files (list of file paths)
- Failed tests or linter errors (specific list)
- Whether a code fix is needed or if it is a transient/environment issue
- Recommended fix approach (brief)

## Step 6: Dispatch the developer agent (if fix needed)

If the debugger determined that a code fix is needed, invoke `@developer` passing:
1. The full root cause analysis from the debugger
2. The specific files that need to be modified
3. The failed job names and test/lint errors so developer can verify the fix

Instruct the developer to:
- Apply the minimal fix to resolve the CI failure
- Follow project standards: `GEMINI.md`, `.gemini/rules/code-style.md`, `.gemini/rules/architecture.md`
- For lint failures, run the relevant linter to verify:
  ```bash
  docker compose exec app ./vendor/bin/phpstan analyse --memory-limit=2G
  docker compose exec app ./vendor/bin/pint --test
  docker compose exec app ./vendor/bin/rector process --dry-run
  docker compose exec app pnpm prettier --check .
  docker compose exec app pnpm eslint .
  docker compose exec app pnpm tsc --noEmit
  ```
- For test failures, run the failing test to verify:
  ```bash
  docker compose exec app php artisan test --compact --filter="FailingTestMethod"
  ```
- If tests pass, run the broader suite for the affected area:
  ```bash
  docker compose exec app php artisan test --compact --testsuite=Unit
  docker compose exec app php artisan test --compact --testsuite=Feature
  ```
- Do NOT refactor or "clean up" adjacent code

If the debugger determined it is a transient/environment issue, skip the developer and inform the user with the diagnosis. Offer to rerun the failed jobs:
```bash
GITHUB_TOKEN=$GITHUB_PERSONAL_ACCESS_TOKEN gh run rerun <run-id> --repo <ORG>/<REPO> --failed
```

## Step 7: Present results to user

Present:
- Diagnosis: which CI jobs failed and why; code issue or transient?
- Fix applied (if any): files modified, what changed, local verification results
- Next steps: ask the user if they want to commit and push the fix; do NOT push without explicit consent
"""
